name: Download Python distribution files (workflow artifact)
description: >
    Download built distribution files from a workflow artifact into a local
    "dist-download" directory, ready to be published.
inputs:
    artifact-name:
        description: Name of the workflow artifact to download
        required: true
        type: string

runs:
    using: composite
    steps:
        -   name: Download build artifact
            uses: actions/download-artifact@v8
            with:
                name: ${{ inputs.artifact-name }}
                path: dist-download
