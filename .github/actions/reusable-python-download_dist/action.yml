name: Download Python distribution files
description: >
    Download built distribution files (from a workflow artifact or a GitHub
    release) to a local "dist-download" directory, ready to be published
    (e.g. with pypa/gh-action-pypi-publish). This is a plain composite
    action (no self-resolving docker step), so it is safe to call from
    another composite action or from a caller's top-level workflow.
inputs:
    source:
        description: 'Where to fetch the built packages from: "artifact" or "release"'
        required: true
        type: string
    artifact-name:
        description: 'Name of the workflow artifact to download. Required when source is "artifact"'
        required: false
        type: string
        default: ''
    release-tag:
        description: 'Tag of the GitHub release to download assets from. Required when source is "release"'
        required: false
        type: string
        default: ''
    github-token:
        description: 'Token used to download release assets via "gh release download". Required when source is "release"'
        required: false
        type: string
        default: ''

runs:
    using: composite
    steps:
        -   name: Download build artifact
            if: ${{ inputs.source == 'artifact' }}
            uses: actions/download-artifact@v8
            with:
                name: ${{ inputs.artifact-name }}
                path: dist-download
        -   name: Download release assets
            if: ${{ inputs.source == 'release' }}
            shell: bash
            env:
                GITHUB_TOKEN: ${{ inputs.github-token }}
                GH_REPO: ${{ github.repository }}
                INPUTS_RELEASE_TAG: ${{ inputs.release-tag }}
            run: |
                mkdir -p dist-download
                cd dist-download
                gh release download "${INPUTS_RELEASE_TAG}" -p '*.tar.gz' -p '*.whl'
