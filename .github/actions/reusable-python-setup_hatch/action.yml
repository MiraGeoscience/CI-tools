name: Setup hatch env
description: Setup hatch environment for Python
inputs:
  cache-number:
    description: Cache number to reset cache if pyproject.toml has not changed
    required: true
    type: number
  runner-os:
    description: Runner OS
    required: true
    type: string

runs:
  using: composite
  steps:
    - name: Install Hatch
      uses: $/.github/actions/setup-ci-tool
      with:
        package: hatch
        cache-suffix: ${{ inputs.cache-number }}
