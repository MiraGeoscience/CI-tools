[project]
name = "ci-tools"
version = "0.1.0"
requires-python = ">=3.10,<4"

[dependency-groups]
poetry = [
    "poetry~=2.5.1",
    "poetry-dynamic-versioning~=1.10.1",
]
pre-commit = ["pre-commit~=4.7.0; python_version >= '3.11'"]
hatch = ["hatch~=1.18.2"]
build = ["build~=1.6.1"]
packaging = ["packaging~=26.3.0"]
uv = ["uv~=0.13.8"]
zizmor = ["zizmor~=1.32.0; python_version >= '3.11'"]
codecov-cli = ["codecov-cli~=11.3.2"]
pytest = ["pytest~=9.2.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["../tests"]
