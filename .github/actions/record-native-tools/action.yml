name: Record native tool inventory
description: Publish effective native versions as data for the private graph publisher
inputs:
  tools:
    description: JSON object mapping catalog tool names to fixed installed pins, or empty strings to query CLI versions
    default: "{}"
    required: false
runs:
  using: composite
  steps:
    - name: Set up inventory Python without changing caller Python
      id: python
      if: >-
        contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) &&
        github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.15"
        update-environment: false
    - name: Prepare native inventory data
      id: inventory
      if: steps.python.outcome == 'success'
      shell: bash
      env:
        INVENTORY_PYTHON: ${{ steps.python.outputs.python-path }}
        INVENTORY_ACTION_PATH: ${{ github.action_path }}
        INVENTORY_TOOLS: ${{ inputs.tools }}
      run: '"$INVENTORY_PYTHON" "$INVENTORY_ACTION_PATH/../setup-ci-tool/record_native_tools.py" --tools "$INVENTORY_TOOLS"'
    - name: Archive native inventory data
      if: steps.inventory.outputs.path != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.inventory.outputs.name }}
        path: ${{ steps.inventory.outputs.path }}
        if-no-files-found: error
