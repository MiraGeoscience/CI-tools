name: Bot PR approval

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: string
      enable_auto_merge:
        description: Enable auto-merge after bot approval
        required: false
        default: true
        type: boolean
      merge_method:
        description: Merge method to use when auto-merge is enabled
        required: false
        default: squash
        type: choice
        options:
          - squash
          - merge
          - rebase
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write

jobs:
  call-workflow-bot-pr-approval:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request &&
      contains(github.event.comment.body, '/bot-approve') &&
      contains(fromJson('["COLLABORATOR","MEMBER","OWNER"]'), github.event.comment.author_association))
    uses: ./.github/workflows/reusable-bot-pr-approval.yml
    with:
      pr-number: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.pr_number || github.event.issue.number }}
      enable-auto-merge: ${{ github.event_name == 'workflow_dispatch' && fromJSON(github.event.inputs.enable_auto_merge) || true }}
      merge-method: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.merge_method || 'squash' }}
    secrets:
      org-shared-app-id: ${{ secrets.ORG_SHARED_APP_ID }}
      org-shared-app-key: ${{ secrets.ORG_SHARED_APP_KEY }}
