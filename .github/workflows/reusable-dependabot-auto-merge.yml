# This workflow approves and enables auto-merge for Dependabot PRs
# belonging to a trusted, pre-approved dependency group.

name: Dependabot auto-merge

on:
  workflow_call:
    inputs:
      dependabot-groups:
        required: false
        type: string
        default: mirageo-ci-tools,pre-commit-hooks
        description: Comma-separated list of Dependabot group names (from dependabot.yml) allowed to auto-merge
      checks-to-skip:
        required: false
        type: string
        default: ''
        description: Comma-separated list of external check contexts to mark as passed before enabling auto-merge

permissions:
  contents: write
  pull-requests: write
  statuses: write
  checks: read

jobs:
  validate-group:
    if: >
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      startsWith(github.event.pull_request.head.ref, 'dependabot/') &&
      startsWith(github.event.pull_request.title, 'Bump ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      is_allowed_group: ${{ steps.check.outputs.is_allowed_group }}
    steps:
      - name: Check Dependabot group
        id: check
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          GROUPS: ${{ inputs.dependabot-groups }}
        run: |
          # Dependabot names grouped-update branches "dependabot/<ecosystem>/<target>/<group>-<hash>",
          # e.g. "dependabot/pre_commit/main/pre-commit-hooks-251825f045".
          branch_suffix="${HEAD_REF##*/}"
          allowed=false
          IFS=',' read -ra groups <<< "$GROUPS"
          for group in "${groups[@]}"; do
            group=$(echo "$group" | xargs)
            if [ -n "$group" ] && [[ "$branch_suffix" =~ ^${group}-[0-9a-f]+$ ]]; then
              allowed=true
              break
            fi
          done
          echo "is_allowed_group=$allowed" >> "$GITHUB_OUTPUT"

  auto-merge:
    needs: validate-group
    if: needs.validate-group.outputs.is_allowed_group == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Check update type
      id: metadata
      uses: dependabot/fetch-metadata@v2
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Validate checks-to-skip
      id: validate
      if: inputs.checks-to-skip != ''
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        CHECKS_TO_SKIP: ${{ inputs.checks-to-skip }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        BASE_REF: ${{ github.event.pull_request.base.ref }}
      run: |
        rules_url="repos/$GITHUB_REPOSITORY/rules/branches/${BASE_REF//\//%2F}"
        if ! required=$(gh api "$rules_url" --jq '[.[]|select(.type=="required_status_checks")|.parameters.required_status_checks[].context]|unique|.[]'); then
          echo "::warning::Could not read required checks on $BASE_REF; not checking for typos."
          required=""
        fi
        valid=()
        IFS=',' read -ra checks_to_skip <<< "$CHECKS_TO_SKIP"
        for check in "${checks_to_skip[@]}"; do
          check=$(echo "$check" | xargs)
          if [ -n "$check" ]; then
            match=$(gh api \
              "repos/$GITHUB_REPOSITORY/commits/$PR_HEAD_SHA/check-runs" \
              --jq '.check_runs[] | select(.app.slug == "github-actions" and .name == $check) | .name' \
              --arg check "$check" \
              | head -n 1)
            if [ -n "$match" ]; then
              echo "::warning::Ignoring '$check': a GitHub Actions check cannot be skipped."
            elif [ -n "$required" ] && ! grep -Fxq "$check" <<< "$required"; then
              echo "::warning::Ignoring '$check': not a required check on $BASE_REF (typo?)."
            else
              valid+=("$check")
            fi
          fi
        done
        checks=$(IFS=,; echo "${valid[*]}")
        echo "Usable checks-to-skip: $checks"
        echo "checks=$checks" >> "$GITHUB_OUTPUT"

    - name: Mark skipped external checks as passed
      if: >
        steps.validate.outputs.checks != '' &&
        (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
         steps.metadata.outputs.update-type == 'version-update:semver-minor')
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        CHECKS_TO_SKIP: ${{ steps.validate.outputs.checks }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PR_URL: ${{ github.event.pull_request.html_url }}
      run: |
        IFS=',' read -ra checks_to_skip <<< "$CHECKS_TO_SKIP"
        for check in "${checks_to_skip[@]}"; do
          check=$(echo "$check" | xargs)
          if [ -n "$check" ]; then
            echo "Marking '$check' as passed"
            gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/statuses/$PR_HEAD_SHA" \
              -f state=success \
              -f context="$check" \
              -f description="Marked passed by Dependabot auto-merge" \
              -f target_url="$PR_URL"
          fi
        done

    - name: Approve and enable auto-merge
      if: >
        steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
        steps.metadata.outputs.update-type == 'version-update:semver-minor'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PR_URL: ${{ github.event.pull_request.html_url }}
        CHECKS_TO_SKIP: ${{ steps.validate.outputs.checks }}
      run: |
        gh pr review --approve "$PR_URL"
        if [[ ",${CHECKS_TO_SKIP// /}," == *",Jenkins,"* ]]; then
          echo "Jenkins is faked for this PR - polling required checks, then merging directly."
          merged=false
          for i in $(seq 1 16); do
            sleep 15
            if gh pr merge --merge "$PR_URL"; then
              merged=true
              break
            fi
          done
          if [ "$merged" = false ]; then
            echo "Not mergeable after ~4 minutes - falling back to native auto-merge."
            gh pr merge --auto --merge "$PR_URL"
          fi
        else
          gh pr merge --auto --merge "$PR_URL"
        fi
