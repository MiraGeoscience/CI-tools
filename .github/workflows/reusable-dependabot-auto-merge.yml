# This workflow approves and enables auto-merge for Dependabot PRs
# belonging to a trusted, pre-approved dependency group.

name: Dependabot auto-merge

on:
  workflow_call:
    inputs:
      dependabot-groups:
        required: false
        type: string
        default: mirageo-ci-tools,pre-commit-hooks
        description: Comma-separated list of Dependabot group names (from dependabot.yml) allowed to auto-merge
      checks-to-skip:
        required: false
        type: string
        default: ''
        description: Comma-separated list of external check contexts to mark as passed before enabling auto-merge

permissions:
  contents: write
  pull-requests: write
  statuses: write
  checks: read

jobs:
  validate-group:
    if: >
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      startsWith(github.event.pull_request.head.ref, 'dependabot/') &&
      startsWith(github.event.pull_request.title, 'Bump ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      is_allowed_group: ${{ steps.check.outputs.is_allowed_group }}
      group: ${{ steps.check.outputs.group }}
    steps:
      - name: Check Dependabot group
        id: check
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          GROUPS: ${{ inputs.dependabot-groups }}
        run: |
          # Dependabot names grouped-update branches "dependabot/<ecosystem>/<target>/<group>-<hash>",
          # e.g. "dependabot/pre_commit/main/pre-commit-hooks-251825f045".
          branch_suffix="${HEAD_REF##*/}"
          allowed=false
          matched_group=''
          IFS=',' read -ra groups <<< "$GROUPS"
          for group in "${groups[@]}"; do
            group=$(echo "$group" | xargs)
            if [ -n "$group" ] && [[ "$branch_suffix" =~ ^${group}-[0-9a-f]+$ ]]; then
              allowed=true
              matched_group="$group"
              break
            fi
          done
          echo "is_allowed_group=$allowed" >> "$GITHUB_OUTPUT"
          echo "group=$matched_group" >> "$GITHUB_OUTPUT"

  auto-merge:
    needs: validate-group
    if: needs.validate-group.outputs.is_allowed_group == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Check update type
      id: metadata
      uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Decide whether to auto-merge
      id: policy
      env:
        UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        GROUP: ${{ needs.validate-group.outputs.group }}
      run: |
        # Majors only for pre-commit-hooks: the PR's own pre-commit run validates the new hook versions.
        should_merge=false
        case "$UPDATE_TYPE" in
          version-update:semver-patch|version-update:semver-minor) should_merge=true ;;
          version-update:semver-major) [ "$GROUP" = "pre-commit-hooks" ] && should_merge=true ;;
        esac
        echo "Update type: ${UPDATE_TYPE:-unknown}, group: $GROUP, auto-merge: $should_merge"
        echo "should_merge=$should_merge" >> "$GITHUB_OUTPUT"

    - name: Validate checks-to-skip are not GitHub Actions checks
      if: inputs.checks-to-skip != ''
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        CHECKS_TO_SKIP: ${{ inputs.checks-to-skip }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        IFS=',' read -ra checks_to_skip <<< "$CHECKS_TO_SKIP"
        for check in "${checks_to_skip[@]}"; do
          check=$(echo "$check" | xargs)
          if [ -n "$check" ]; then
            match=$(gh api \
              "repos/$GITHUB_REPOSITORY/commits/$PR_HEAD_SHA/check-runs" \
              --jq '.check_runs[] | select(.app.slug == "github-actions" and .name == $check) | .name' \
              --arg check "$check" \
              | head -n 1)
            if [ -n "$match" ]; then
              echo "::error::Cannot skip a GitHub Actions check: $check"
              exit 1
            fi
          fi
        done

    - name: Mark skipped external checks as passed
      if: inputs.checks-to-skip != '' && steps.policy.outputs.should_merge == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        CHECKS_TO_SKIP: ${{ inputs.checks-to-skip }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PR_URL: ${{ github.event.pull_request.html_url }}
      run: |
        IFS=',' read -ra checks_to_skip <<< "$CHECKS_TO_SKIP"
        for check in "${checks_to_skip[@]}"; do
          check=$(echo "$check" | xargs)
          if [ -n "$check" ]; then
            echo "Marking '$check' as passed"
            gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/statuses/$PR_HEAD_SHA" \
              -f state=success \
              -f context="$check" \
              -f description="Marked passed by Dependabot auto-merge" \
              -f target_url="$PR_URL"
          fi
        done

    - name: Approve and enable auto-merge
      if: steps.policy.outputs.should_merge == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PR_URL: ${{ github.event.pull_request.html_url }}
      run: |
        gh pr review --approve "$PR_URL"
        gh pr merge --auto --merge "$PR_URL"
