name: Zizmor analysis

on:
  workflow_call:
    inputs:
      min_severity:
        description: "Minimum severity: informational|low|medium|high"
        required: false
        default: medium
        type: string
      min_confidence:
        description: "Minimum confidence: low|medium|high"
        required: false
        default: low
        type: string
      persona:
        description: "Audit persona: regular|pedantic|auditor"
        required: false
        default: regular
        type: string

jobs:
  zizmor:
    name: Security Scan
    if: ${{ (github.event_name != 'pull_request') || (github.event.pull_request.draft == false) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Zizmor Config
        uses: $/.github/actions/setup-zizmor-config

      - name: Run Zizmor Security Scan
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: ${{ github.event_name != 'pull_request' && github.event.repository.visibility == 'public' }}
          annotations: ${{ github.event_name == 'pull_request' || github.event.repository.visibility == 'private' }}
          persona: ${{ inputs.persona }}
          min-severity: ${{ inputs.min_severity }}
          min-confidence: ${{ inputs.min_confidence }}
