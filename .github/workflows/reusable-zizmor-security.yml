name: Zizmor analysis

# Single entry point for zizmor scans (replaces reusable-zizmor-annotate.yml and
# reusable-zizmor-advanced-security.yml). Call it once per event, for example:
#   annotations: ${{ github.event_name == 'pull_request' }}
#   advanced-security: ${{ github.event_name != 'pull_request' }}   # public repositories only
#
# Permissions are inherited from the caller job, which must grant:
#   contents: read, actions: read
#   security-events: write   only when advanced-security is true

on:
  workflow_call:
    inputs:
      min_severity:
        description: "Minimum severity: informational|low|medium|high"
        required: false
        default: medium
        type: string
      min_confidence:
        description: "Minimum confidence: low|medium|high"
        required: false
        default: low
        type: string
      persona:
        description: "Audit persona: regular|pedantic|auditor"
        required: false
        default: regular
        type: string
      annotations:
        description: Emit findings as workflow annotations (ignored when advanced-security is true)
        required: false
        default: false
        type: boolean
      advanced-security:
        description: >
          Upload findings as SARIF to code scanning (requires GitHub Advanced Security or a public
          repository, and `security-events: write` on the caller job)
        required: false
        default: false
        type: boolean

jobs:
  zizmor:  # zizmor: ignore[excessive-permissions] bounded by the caller job permissions
    name: Security Scan
    if: ${{ (github.event_name != 'pull_request') || (github.event.pull_request.draft == false) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Zizmor Config
        uses: MiraGeoscience/CI-tools/.github/actions/setup-zizmor-config@3ff92aeffa5b92d646abea073ed5ad06117e57f6 # v3.11.0

      - name: Run Zizmor Security Scan
        uses: zizmorcore/zizmor-action@0dce2577a4760a2749d8cfb7a84b7d5585ebcb7d # v0.5.0
        with:
          advanced-security: ${{ inputs.advanced-security }}
          annotations: ${{ inputs.annotations && !inputs.advanced-security }}
          persona: ${{ inputs.persona }}
          min-severity: ${{ inputs.min_severity }}
          min-confidence: ${{ inputs.min_confidence }}
