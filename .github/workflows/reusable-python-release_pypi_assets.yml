name: Publish PyPI package from release assets

on:
  workflow_call:
    inputs:
        package-name:
            description: Name of the package to publish
            required: true
            type: string
        virtual-repo-names:
            description: >
                List of repository names to publish to (e.g. ["public-pypi-prod", "geophysics-pypi-prod"]).
                "pypi"/"test-pypi" are a deliberate no-op here; PyPI publishing runs in the caller (DEVOPS-1154).
            required: true
            type: string
        release-tag:
            description: Tag for the existing (draft) release to publish assets from
            required: true
            type: string

    secrets:
        JFROG_ARTIFACTORY_URL:
            description: JFrog Artifactory URL
            required: true
        JFROG_ARTIFACTORY_TOKEN:
            description: JFrog Artifactory Token
            required: true
        PYPI_TOKEN:
            description: PyPI Token
            required: false

defaults:
    run:
        shell: 'bash -l {0}'

jobs:
    publish_pypi_assets:
        name: Publish PyPI assets
        permissions:
            contents: write
        if: ${{ github.repository_owner == 'MiraGeoscience' }}
        runs-on: 'ubuntu-latest'
        timeout-minutes: 5
        strategy:
            fail-fast: false
            matrix:
                virtual-repo-name: ${{ fromJson(inputs.virtual-repo-names) }}
        steps:
            -   name: Find release from tag
                uses: MiraGeoscience/CI-tools/.github/actions/reusable-get_draft_release@3ff92aeffa5b92d646abea073ed5ad06117e57f6 # v3.11.0
                id: find-release
                with:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                    existing-release: ${{ inputs.release-tag }}
            -   name: Download release assets
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                    GH_REPO: ${{ github.repository }}
                    INPUTS_RELEASE_TAG: ${{ inputs.release-tag }}
                run: |
                    mkdir -p download-assets
                    cd download-assets
                    gh release download ${INPUTS_RELEASE_TAG} -p '*.tar.gz' -p '*.whl'
            -   name: Publish package to Artifactory
                uses: MiraGeoscience/CI-tools/.github/actions/reusable-python-publish_to_artifactory@3ff92aeffa5b92d646abea073ed5ad06117e57f6 # v3.11.0
                if: ${{ matrix.virtual-repo-name != 'pypi' && matrix.virtual-repo-name != 'test-pypi' }}
                with:
                    build-dir-path: download-assets
                    artifactory-dir-path: ${{ matrix.virtual-repo-name }}/${{ inputs.package-name }}/${{ inputs.release-tag }}
                    JFROG_ARTIFACTORY_URL: ${{ secrets.JFROG_ARTIFACTORY_URL }}
                    JFROG_ARTIFACTORY_TOKEN: ${{ secrets.JFROG_ARTIFACTORY_TOKEN }}
            -   name: Fail on PyPI/TestPyPI virtual-repo-name
                if: ${{ matrix.virtual-repo-name == 'pypi' || matrix.virtual-repo-name == 'test-pypi' }}
                env:
                    VIRTUAL_REPO_NAME: ${{ matrix.virtual-repo-name }}
                run: |
                    echo "::error::Not publishing '${VIRTUAL_REPO_NAME}' here: PyPI trusted publishing must run as a direct step in the caller's top-level workflow, not through this reusable workflow. See the 'virtual-repo-names' input description."
                    exit 1
