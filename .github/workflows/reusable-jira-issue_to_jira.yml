# This workflow will create a JIRA issue upon creation of a GitHub issue

name: Create JIRA issue

on:
  workflow_call:
    secrets:
      JIRA_BASE_URL:
        required: true
        description: The base URL of your JIRA instance
      JIRA_API_TOKEN:
        required: true
        description: The API token for your JIRA account
      JIRA_USER_EMAIL:
        required: true
        description: The email address for your JIRA account
    inputs:
      project-key:
        description: The JIRA project key
        required: true
        type: string
      components:
        description: 'JIRA components (e.g. [{"name": "geoh5py"}])'
        required: false
        type: string


jobs:
  new_jira_issue:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Set Jira fields
      id: set_jira_fields
      env:
        INPUTS_COMPONENTS: ${{ inputs.components }}
      run: |
        if [[ -z "${INPUTS_COMPONENTS}" ]]; then
          echo 'jira_fields={}' >> $GITHUB_OUTPUT
        else
          echo "jira_fields={\"components\": ${INPUTS_COMPONENTS} }" >> $GITHUB_OUTPUT
        fi
    - name: Jira Create issue
      id: create_jira_issue
      env:
        JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
        JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
        JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        PROJECT_KEY: ${{ inputs.project-key }}
        ISSUE_TITLE: ${{ github.event.issue.title }}
        ISSUE_NUMBER: ${{ github.event.issue.number }}
        ISSUE_URL: ${{ github.event.issue.html_url }}
        JIRA_FIELDS: ${{ steps.set_jira_fields.outputs.jira_fields }}
      run: |
        payload=$(jq -n \
          --arg project "$PROJECT_KEY" \
          --arg summary "$ISSUE_TITLE" \
          --arg description "_from [GitHub issue #${ISSUE_NUMBER}|${ISSUE_URL}]_" \
          --argjson extra_fields "$JIRA_FIELDS" \
          '{fields: ({project: {key: $project}, issuetype: {name: "Story"}, summary: $summary, description: $description} + $extra_fields)}')

        response=$(curl -sS -w '\n%{http_code}' -X POST \
          -u "${JIRA_USER_EMAIL}:${JIRA_API_TOKEN}" \
          -H "Content-Type: application/json" \
          -d "$payload" \
          "${JIRA_BASE_URL}/rest/api/2/issue")

        http_status=$(echo "$response" | tail -n1)
        body=$(echo "$response" | sed '$d')

        if [[ "$http_status" -lt 200 || "$http_status" -ge 300 ]]; then
          echo "::error::Jira API returned HTTP $http_status: $body"
          exit 1
        fi

        issue_key=$(echo "$body" | jq -r '.key // empty')
        if [[ -z "$issue_key" ]]; then
          echo "::error::Jira API response did not contain an issue key: $body"
          exit 1
        fi

        echo "Created JIRA issue: $issue_key"
        echo "issue=$issue_key" >> "$GITHUB_OUTPUT"
    - name: Post JIRA link
      uses: peter-evans/create-or-update-comment@v5
      with:
        # The number of the issue or pull request in which to create a comment.
        issue-number: ${{ github.event.issue.number }}
        # The comment body.
        body: "JIRA issue [${{ steps.create_jira_issue.outputs.issue }}] was created."
