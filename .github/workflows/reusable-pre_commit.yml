name: Pre-commit

on:
  workflow_call:
    inputs:
      app-name:
        description: Name of the app to run pre-commit on
        required: false
        type: string
      os:
        description: 'List of OS to run against (e.g. ["ubuntu-latest", "macos-latest"])'
        required: false
        type: string
        default: "['ubuntu-latest']"
      python-version:
        description: Python version used with pre-commit
        required: false
        type: string
        default: "3.10"
      lfs:
        description: Boolean to indicate if GitHub LFS is needed
        required: false
        type: boolean
        default: false
      timeout-minutes:
        description: Timeout in minutes for the job
        required: false
        type: number
        default: 20
      skip:
        description: comma separated list of hooks to skip
        required: false
        type: string
        default: pylint

permissions: {}

jobs:
  pre-commit:
    name: pre-commit
    if: ${{ (github.event_name != 'pull_request') || (github.event.pull_request.draft == false) }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.os) }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read  # checkout and fetch the base branch
    env:
      SKIP: ${{ inputs.skip }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - name: Get base depth
        id: base-depth
        if: ${{ (github.event_name == 'pull_request') }}
        shell: bash
        env:
          PR_COMMITS: ${{ github.event.pull_request.commits }}
        run: |
          depth=$((PR_COMMITS + 1))
          echo "base-depth=$depth"
          echo "base-depth=$depth" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          lfs: ${{ inputs.lfs }}
          # for non PR events, check out to depth 1 (the default)
          fetch-depth: ${{ steps.base-depth.outputs.base-depth || 1}}
          persist-credentials: false
      - name: Fetch target branch
        if: ${{ (github.event_name == 'pull_request') }}
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # One-off credentials: nothing is stored where pre-commit hooks could read it.
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$auth"
          git -c "http.$GITHUB_SERVER_URL/.extraheader=AUTHORIZATION: basic $auth" \
            fetch origin "${BASE_REF}:${BASE_REF}"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Install pre-commit with uv
        run: uv tool install pre-commit
      - name: Cache for pre-commit hooks
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit|${{ env.pythonLocation }}|${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Check if pre-commit config changed
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          changed_files=$(git diff --diff-filter=AM --name-only refs/remotes/origin/${BASE_REF}... --)
          if echo "$changed_files" | grep -qxE '\.pre-commit-config\.ya?ml'; then
            echo "::notice::.pre-commit-config.yaml changed: forcing pre-commit to run on all files"
            echo "FORCE_ALL_FILES=true" >> $GITHUB_ENV
          fi
      - name: Run pre-commit on modified files
        if: ${{ github.event_name == 'pull_request' && !env.FORCE_ALL_FILES }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          uv tool run pre-commit run --hook-stage pre-push --from-ref refs/remotes/origin/${BASE_REF} --to-ref .
      - name: Run pre-commit on all files
        if: ${{ github.event_name == 'push' || env.FORCE_ALL_FILES }}
        run: |
          uv tool run pre-commit run --hook-stage pre-push --all-files
      - name: Run git diff
        if: always()
        shell: bash
        run: git diff
