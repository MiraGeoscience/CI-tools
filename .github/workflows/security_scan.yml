name: Security Scan

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - develop
      - main
      - release/**
      - feature/**
      - hotfix/**
  push:
    branches:
      - develop
      - main
      - release/**
      - feature/**
      - hotfix/**

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  call-workflow-zizmor:
    # One job per event; the name keeps the check contexts required by the org rulesets.
    name: ${{ github.event_name == 'pull_request' && 'Zizmor analysis (annotate)' || 'Zizmor analysis (advanced security)' }}
    permissions:
      contents: read  # checkout
      actions: read  # resolve action references
      security-events: write  # upload SARIF on push
    uses: ./.github/workflows/reusable-zizmor-security.yml
    with:
      annotations: ${{ github.event_name == 'pull_request' }}
      advanced-security: ${{ github.event_name != 'pull_request' }}
