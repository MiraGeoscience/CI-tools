# Report pixi.lock changes as Markdown in the job summary, with a short PR comment (updated on each run) linking to it.

name: Pixi lock diff

on:
  workflow_call:
    inputs:
      lockfile-path:
        description: Lock file path
        required: false
        type: string
        default: pixi.lock
      manifest-path:
        description: Manifest path, to identify explicit dependencies
        required: false
        type: string
        default: pixi.toml
      merge-dependencies:
        description: pixi-diff-to-markdown table merging ('no', 'yes' or 'split-explicit')
        required: false
        type: string
        default: split-explicit
      environments:
        description: Comma-separated environments to report on (all if empty)
        required: false
        type: string
        default: ''
      comment-on-pr:
        description: Post the report as a PR comment
        required: false
        type: boolean
        default: true
      pixi-version:
        description: Pixi version
        required: false
        type: string
        default: v0.67.2  # last version before lock file v7
      timeout-minutes:
        description: Job timeout in minutes
        required: false
        type: number
        default: 10

permissions: {}

env:
  PIXI_DIFF_VERSION: 0.1.8
  PIXI_DIFF_TO_MARKDOWN_VERSION: 0.3.9
  COMMENT_MARKER: <!-- pixi-lock-diff -->

jobs:
  pixi-lock-diff:
    name: pixi.lock diff
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # one run at a time per PR (or branch): avoids duplicate or outdated comments
    concurrency:
      group: pixi-lock-diff-${{ github.event.pull_request.number || github.ref }}-${{ inputs.lockfile-path }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        shell: bash
    env:
      LOCKFILE_PATH: ${{ inputs.lockfile-path }}
      MANIFEST_PATH: ${{ inputs.manifest-path }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # no sparse-checkout: its partial clone cannot fetch old lock files without credentials
          fetch-depth: 0
          persist-credentials: false

      - name: Select commits to compare
        id: commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            # merge base: ignore base branch changes made after the PR branched off
            after="$PR_HEAD_SHA"
            before=$(git merge-base "origin/$BASE_REF" "$after")
          elif [[ "$EVENT_NAME" == "push" ]]; then
            after="$GITHUB_SHA"
            if [[ -n "$PUSH_BEFORE" && ! "$PUSH_BEFORE" =~ ^0+$ ]] && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
              before="$PUSH_BEFORE"
            else
              # new branch, or previous head no longer available (force push)
              echo "::notice::Previous commit of the push is not available: comparing to the merge base with '$DEFAULT_BRANCH'"
              before=$(git merge-base "origin/$DEFAULT_BRANCH" "$after")
            fi
          else
            echo "::error::Unsupported event '$EVENT_NAME': expected pull_request or push"
            exit 1
          fi
          echo "before: $before"
          echo "after: $after"
          echo "before=$before" >> "$GITHUB_OUTPUT"
          echo "after=$after" >> "$GITHUB_OUTPUT"

      - name: Extract lock files
        id: files
        env:
          BEFORE: ${{ steps.commits.outputs.before }}
          AFTER: ${{ steps.commits.outputs.after }}
        run: |
          WORK_DIR="$RUNNER_TEMP/pixi-lock-diff"
          echo "WORK_DIR=$WORK_DIR" >> "$GITHUB_ENV"
          mkdir -p "$WORK_DIR/before" "$WORK_DIR/after"
          if ! git show "$AFTER:$LOCKFILE_PATH" > "$WORK_DIR/after/pixi.lock"; then
            echo "::error::Lock file '$LOCKFILE_PATH' not found at $AFTER"
            exit 1
          fi
          if [ -n "$(git ls-tree "$BEFORE" -- "$LOCKFILE_PATH")" ]; then
            if ! git show "$BEFORE:$LOCKFILE_PATH" > "$WORK_DIR/before/pixi.lock"; then
              echo "::error::Could not read lock file '$LOCKFILE_PATH' at $BEFORE"
              exit 1
            fi
            echo "new-lockfile=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Lock file '$LOCKFILE_PATH' does not exist at $BEFORE: reporting all packages as added"
            printf 'version: 6\nenvironments: {}\npackages: []\n' > "$WORK_DIR/before/pixi.lock"
            echo "new-lockfile=true" >> "$GITHUB_OUTPUT"
          fi
          # keep the file name: pixi.toml and pyproject.toml are parsed differently
          manifest="$WORK_DIR/after/$(basename "$MANIFEST_PATH")"
          if git show "$AFTER:$MANIFEST_PATH" > "$manifest" 2>/dev/null; then
            echo "manifest=$manifest" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Manifest '$MANIFEST_PATH' not found at $AFTER: explicit dependencies will not be identified"
            rm -f "$manifest"
          fi

      - uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6
        with:
          pixi-version: ${{ inputs.pixi-version }}
          run-install: false
          cache: false

      - name: Compute diff
        env:
          MANIFEST: ${{ steps.files.outputs.manifest }}
          ENVIRONMENTS: ${{ inputs.environments }}
        run: |
          manifest_args=()
          if [ -n "$MANIFEST" ]; then
            manifest_args=(--manifest-path "$MANIFEST")
          fi
          pixi exec -s "pixi-diff==$PIXI_DIFF_VERSION" pixi-diff \
            --before "$WORK_DIR/before/pixi.lock" --after "$WORK_DIR/after/pixi.lock" \
            "${manifest_args[@]}" > "$WORK_DIR/diff.json"

          if [ -n "$ENVIRONMENTS" ]; then
            echo "Keeping environments: $ENVIRONMENTS"
            jq --arg envs "$ENVIRONMENTS" \
              '($envs | split(",") | map(gsub(" "; ""))) as $keep
               | .environment |= with_entries(select(.key as $k | $keep | index($k)))' \
              "$WORK_DIR/diff.json" > "$WORK_DIR/diff-filtered.json"
            mv "$WORK_DIR/diff-filtered.json" "$WORK_DIR/diff.json"
          fi

      - name: Convert diff to Markdown
        env:
          MERGE_DEPENDENCIES: ${{ inputs.merge-dependencies }}
        run: |
          pixi exec -s "pixi-diff-to-markdown==$PIXI_DIFF_TO_MARKDOWN_VERSION" pixi-diff-to-markdown \
            --merge-dependencies "$MERGE_DEPENDENCIES" < "$WORK_DIR/diff.json" > "$WORK_DIR/dependencies.md"

      - name: List git dependency changes
        shell: python
        run: |
          """Git dependency commits (pixi-diff-to-markdown shows them as 'unknown')."""
          from __future__ import annotations

          import json
          import os
          import re
          from pathlib import Path
          from urllib.parse import parse_qs, urlsplit

          work_dir = Path(os.environ["WORK_DIR"])
          diff = json.loads((work_dir / "diff.json").read_text(encoding="utf-8"))

          def parse(package: dict | None) -> dict | None:
              """Parse 'git+<repo>[?rev=|branch=|tag=<ref>][&subdirectory=...]#<sha>'."""
              url = (package or {}).get("pypi", "")
              if not url.startswith("git+"):
                  return None
              parts = urlsplit(url.removeprefix("git+"))
              if not re.fullmatch(r"[0-9a-f]{7,40}", parts.fragment):
                  return None
              query = parse_qs(parts.query)
              rev = next((query[key][0] for key in ("rev", "branch", "tag") if key in query), "")
              repo = f"{parts.scheme}://{parts.netloc}{parts.path}".removesuffix(".git")
              return {"repo": repo, "rev": rev, "sha": parts.fragment, "version": package.get("version", "")}

          def describe(ref: dict | None) -> str:
              if ref is None:
                  return ""
              rev = f"`{ref['rev']}` @ " if ref["rev"] else ""
              return f"{rev}[`{ref['sha'][:8]}`]({ref['repo']}/commit/{ref['sha']}) ({ref['version']})"

          changes = {}
          for platforms in diff.get("environment", {}).values():
              for packages in platforms.values():
                  for package in packages:
                      before, after = parse(package.get("before")), parse(package.get("after"))
                      if before or after:
                          # one row per distinct change: environments may resolve different commits
                          key = (package["name"], (before or {}).get("sha", ""), (after or {}).get("sha", ""))
                          changes.setdefault(key, (before, after))

          rows = []
          for (name, _, _), (before, after) in sorted(changes.items()):
              if before and after and before["repo"] == after["repo"] and "github.com" in after["repo"]:
                  compare = f"[compare]({after['repo']}/compare/{before['sha']}...{after['sha']})"
              else:
                  compare = ""
              rows.append(f"|{name}|{describe(before)}|{describe(after)}|{compare}|")

          markdown = ""
          if rows:
              markdown = "\n".join(
                  ["### Git dependencies", "", "|Dependency|Before|After|Changes|", "|-|-|-|-|", *rows, ""]
              )
          (work_dir / "git-dependencies.md").write_text(markdown, encoding="utf-8")
          print(markdown or "No git dependency changes")

      - name: Assemble report
        env:
          BEFORE: ${{ steps.commits.outputs.before }}
          AFTER: ${{ steps.commits.outputs.after }}
          NEW_LOCKFILE: ${{ steps.files.outputs.new-lockfile }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          ENVIRONMENTS: ${{ inputs.environments }}
        run: |
          report="$WORK_DIR/report.md"
          {
            echo "$COMMENT_MARKER"
            echo "## 📦 Changes in \`$LOCKFILE_PATH\`"
            echo
            echo "Comparing [\`${BEFORE:0:8}\`]($REPO_URL/commit/$BEFORE) to [\`${AFTER:0:8}\`]($REPO_URL/commit/$AFTER)${ENVIRONMENTS:+, environments: \`$ENVIRONMENTS\`} ([workflow run]($RUN_URL))."
            echo
            if [ "$NEW_LOCKFILE" == "true" ]; then
              echo "> [!NOTE]"
              echo "> \`$LOCKFILE_PATH\` is new: all packages are reported as added."
              echo
            fi
            cat "$WORK_DIR/git-dependencies.md"
            echo
            if [ "$(tr -d '[:space:]' < "$WORK_DIR/dependencies.md")" == "Nodiff" ]; then
              echo "*No package changes.*"
            else
              # nest headings under the report title
              sed -E 's/^# /### /' "$WORK_DIR/dependencies.md"
            fi
          } > "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on pull request
        if: >
          inputs.comment-on-pr &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_ID: ${{ job.check_run_id }}
        run: |
          # short comment linking to the job summary: the full tables are not duplicated in the conversation
          summary_url="$RUN_URL${JOB_ID:+#summary-$JOB_ID}"
          # one status per package name, across environments and platforms
          stats=$(jq -r '
            [.environment[][][]
             | {name, explicit, status: (if .before == null then "added" elif .after == null then "removed" else "updated" end)}]
            | group_by(.name)
            | map({name: .[0].name, explicit: any(.[]; .explicit),
                   status: (if all(.[]; .status == "added") then "added"
                            elif all(.[]; .status == "removed") then "removed" else "updated" end)})
            | if length == 0 then "*No package changes.*" else
                "**\(length)** packages changed: \(map(select(.status == "added")) | length) added, \(map(select(.status == "removed")) | length) removed, \(map(select(.status == "updated")) | length) updated."
                + (map(select(.explicit) | "`\(.name)`") | if length > 0 then " Explicit: \(join(", "))." else "" end)
              end' "$WORK_DIR/diff.json")

          body="$WORK_DIR/comment.md"
          {
            sed -n '1,/^Comparing /p' "$WORK_DIR/report.md"
            echo
            echo "$stats"
            echo
            cat "$WORK_DIR/git-dependencies.md"
            echo
            echo "📋 **[Full report in the job summary]($summary_url)**"
          } > "$body"

          existing=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$COMMENT_MARKER\"))) | \"\(.id) \(.node_id)\"" \
            | head -n 1)
          if [ -n "$existing" ]; then
            read -r comment_id node_id <<< "$existing"
            minimized=$(gh api graphql -f query='query($id: ID!) { node(id: $id) { ... on IssueComment { isMinimized } } }' \
              -f id="$node_id" --jq '.data.node.isMinimized')
            if [ "$minimized" == "true" ]; then
              # replace a hidden comment so the new report is visible
              echo "Existing comment $comment_id is hidden: replacing it"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id"
            else
              echo "Updating comment $comment_id"
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -F body=@"$body" > /dev/null
              exit 0
            fi
          fi
          echo "Creating comment"
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -F body=@"$body" > /dev/null
