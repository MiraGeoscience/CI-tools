name: Create JIRA issue

on:
  issues:
    types: [opened]

permissions: {}

jobs:
  call-workflow-create-jira-issue:
    uses: ./.github/workflows/reusable-jira-issue_to_jira.yml
    permissions:
      issues: write  # comment the Jira link on the GitHub issue
    secrets:
      JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
      JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
    with:
      project-key: DEVOPS
