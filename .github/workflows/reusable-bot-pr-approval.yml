name: Bot PR approval

on:
  workflow_call:
    secrets:
      org-shared-app-id:
        required: true
      org-shared-app-key:
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  approve-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PR_NUMBER: ${{ github.event.issue.number }}
      COMMENT_ID: ${{ github.event.comment.id }}
      USER_LOGIN: ${{ github.event.comment.user.login }}

    steps:
      - name: Reply to unauthorized user
        if: |
          github.event.issue.pull_request &&
          contains(github.event.comment.body, '/bot-approve') &&
          !contains(fromJson('["COLLABORATOR","MEMBER","OWNER"]'), github.event.comment.author_association)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            -f body=":no_entry_sign: @$USER_LOGIN is not authorized to trigger /bot-approve."

      - name: Acknowledge authorized command
        if: |
          github.event.issue.pull_request &&
          contains(github.event.comment.body, '/bot-approve') &&
          contains(fromJson('["COLLABORATOR","MEMBER","OWNER"]'), github.event.comment.author_association)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID/reactions" \
            -f content='+1'

          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            -f body=':+1: Command acknowledged. Proceeding with bot approval.'

      - name: Generate bot token
        if: |
          github.event.issue.pull_request &&
          contains(github.event.comment.body, '/bot-approve') &&
          contains(fromJson('["COLLABORATOR","MEMBER","OWNER"]'), github.event.comment.author_association)
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.org-shared-app-id }}
          private-key: ${{ secrets.org-shared-app-key }}

      - name: Check for prior human approval
        if: |
          github.event.issue.pull_request &&
          contains(github.event.comment.body, '/bot-approve') &&
          contains(fromJson('["COLLABORATOR","MEMBER","OWNER"]'), github.event.comment.author_association)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "Checking reviews for PR #$PR_NUMBER..."

          has_approval=$(gh pr view "$PR_NUMBER" --json reviews --jq '[.reviews[] | select(.state == "APPROVED") | select((.author.login | endswith("[bot]")) | not)] | length')

          if [ "$has_approval" -eq 0 ]; then
            echo "Error: This PR does not have any prior human approvals."
            exit 1
          fi

          echo "Found prior human approval. Proceeding."

      - name: Submit bot approval
        if: |
          github.event.issue.pull_request &&
          contains(github.event.comment.body, '/bot-approve') &&
          contains(fromJson('["COLLABORATOR","MEMBER","OWNER"]'), github.event.comment.author_association)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh pr review "$PR_NUMBER" --approve --body "Approved via org-gated automation."

      - name: Enable auto-merge with merge commit
        if: |
          github.event.issue.pull_request &&
          contains(github.event.comment.body, '/bot-approve') &&
          contains(fromJson('["COLLABORATOR","MEMBER","OWNER"]'), github.event.comment.author_association)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh pr merge "$PR_NUMBER" --auto --merge --delete-branch
