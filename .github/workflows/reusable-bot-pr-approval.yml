name: Bot PR approval

on:
  workflow_call:
    inputs:
      pr-number:
        required: true
        type: number
      enable-auto-merge:
        required: false
        type: boolean
        default: false
    secrets:
      org-shared-app-id:
        required: true
      org-shared-app-key:
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  approve-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PR_NUMBER: ${{ inputs.pr-number }}
      COMMENT_ID: ${{ github.event.comment.id }}
      AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}
      COMMENT_BODY: ${{ github.event.comment.body }}
      IS_PR_COMMENT: ${{ github.event.issue.pull_request && 'true' || 'false' }}

    steps:
      - name: Evaluate trigger and authorization
        id: auth
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          role_name=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$GITHUB_ACTOR/permission" --jq '.role_name // "none"' 2>/dev/null || echo "none")
          head_owner=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.repo.owner.login')
          base_owner=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.base.repo.owner.login')

          is_role_allowed=false
          if [ "$role_name" = "admin" ] || [ "$role_name" = "maintain" ]; then
            is_role_allowed=true
          fi

          is_same_org_pr=false
          if [ "$head_owner" = "$base_owner" ]; then
            is_same_org_pr=true
          fi

          is_trusted_commenter=false
          if [ "$AUTHOR_ASSOCIATION" = "COLLABORATOR" ] || [ "$AUTHOR_ASSOCIATION" = "MEMBER" ] || [ "$AUTHOR_ASSOCIATION" = "OWNER" ]; then
            is_trusted_commenter=true
          fi

          is_org_member_commenter=false
          if [ "$AUTHOR_ASSOCIATION" = "MEMBER" ] || [ "$AUTHOR_ASSOCIATION" = "OWNER" ]; then
            is_org_member_commenter=true
          fi

          invalid_comment_trigger=false
          authorized=false
          if [ -n "$COMMENT_ID" ]; then
            if [ "$IS_PR_COMMENT" != "true" ] || ! printf '%s' "$COMMENT_BODY" | grep -q '/bot-approve'; then
              invalid_comment_trigger=true
            elif [ "$is_role_allowed" = "true" ] || { [ "$is_org_member_commenter" = "true" ] && [ "$is_same_org_pr" = "true" ]; }; then
              authorized=true
            fi
          else
            if [ "$is_role_allowed" = "true" ]; then
              authorized=true
            fi
          fi

          echo "role_name=$role_name" >> "$GITHUB_OUTPUT"
          echo "is_same_org_pr=$is_same_org_pr" >> "$GITHUB_OUTPUT"
          echo "is_trusted_commenter=$is_trusted_commenter" >> "$GITHUB_OUTPUT"
          echo "is_org_member_commenter=$is_org_member_commenter" >> "$GITHUB_OUTPUT"
          echo "invalid_comment_trigger=$invalid_comment_trigger" >> "$GITHUB_OUTPUT"
          echo "authorized=$authorized" >> "$GITHUB_OUTPUT"

      - name: Reply to unauthorized user
        if: steps.auth.outputs.authorized == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROLE_NAME: ${{ steps.auth.outputs.role_name }}
          IS_SAME_ORG_PR: ${{ steps.auth.outputs.is_same_org_pr }}
          IS_TRUSTED_COMMENTER: ${{ steps.auth.outputs.is_trusted_commenter }}
          IS_ORG_MEMBER_COMMENTER: ${{ steps.auth.outputs.is_org_member_commenter }}
          INVALID_COMMENT_TRIGGER: ${{ steps.auth.outputs.invalid_comment_trigger }}
        run: |
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            -f body=":no_entry_sign: @$GITHUB_ACTOR is not authorized to trigger bot approval (requires `/bot-approve` on a PR comment and either repo role maintain/admin, or org MEMBER/OWNER + same-org PR; manual dispatch requires maintain/admin). Current role: $ROLE_NAME; trusted commenter: $IS_TRUSTED_COMMENTER; org member/owner: $IS_ORG_MEMBER_COMMENTER; same-org PR: $IS_SAME_ORG_PR; invalid comment trigger: $INVALID_COMMENT_TRIGGER."

      - name: Acknowledge authorized command
        if: steps.auth.outputs.authorized == 'true' && github.event.comment.id
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID/reactions" \
            -f content='+1'

          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            -f body=':+1: Command acknowledged. Proceeding with bot approval.'

      - name: Generate bot token
        if: steps.auth.outputs.authorized == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.org-shared-app-id }}
          private-key: ${{ secrets.org-shared-app-key }}

      - name: Check for prior human approval
        if: steps.auth.outputs.authorized == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "Checking reviews for PR #$PR_NUMBER..."

          has_approval=$(gh pr view "$PR_NUMBER" --json reviews --jq '[.reviews[] | select(.state == "APPROVED") | select((.author.login | endswith("[bot]")) | not)] | length')

          if [ "$has_approval" -eq 0 ]; then
            echo "Error: This PR does not have any prior human approvals."
            exit 1
          fi

          echo "Found prior human approval. Proceeding."

      - name: Submit bot approval
        if: steps.auth.outputs.authorized == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh pr review "$PR_NUMBER" --approve --body "Approved via org-gated automation."

      - name: Enable auto-merge
        if: steps.auth.outputs.authorized == 'true' && inputs.enable-auto-merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh pr merge "$PR_NUMBER" --auto --merge --delete-branch
