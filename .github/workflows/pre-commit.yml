name: pre-commit

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - develop
      - main
      - release/**
      - feature/**
      - hotfix/**
  push:
    branches:
      - develop
      - main
      - release/**
      - feature/**
      - hotfix/**

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  call-workflow-pre-commmit:
    name: Pre-Commit
    uses: ./.github/workflows/reusable-pre_commit.yml
    permissions:
      contents: read  # checkout and fetch the base branch
