name: pre-commit

permissions:
  contents: read
  statuses: write

on:
  pull_request:
    # Run on all PRs to these base branches (including Dependabot pre-commit-hooks PRs)
    # so that required checks are available before auto-merge.
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - develop
      - main
      - release/**
      - feature/**
      - hotfix/**
  push:
    branches:
      - develop
      - main
      - release/**
      - feature/**
      - hotfix/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  call-workflow-pre-commmit:
    name: Pre-Commit
    uses: ./.github/workflows/reusable-pre_commit.yml
